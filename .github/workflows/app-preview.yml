# THE FREE WEB PREVIEW (docs/preview.md): exports the app for a browser with sample papers only and
# publishes it to the Cloudflare Pages project keepmyproof-app-preview. The project root
# https://keepmyproof-app-preview.pages.dev always shows the newest main build; a PR gets its own
# branch link, commented on the PR. Free; no Appetize minutes. Its own job, not part of Fast checks.
name: App preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'assets/**', 'app.config.ts', 'package.json', 'package-lock.json', 'topics.json',
      'scripts/preview/host.mjs', '.github/workflows/app-preview.yml']
  pull_request:
    paths: ['app/**', 'src/**', 'assets/**', 'app.config.ts', 'package.json', 'package-lock.json', 'topics.json',
      'scripts/preview/host.mjs', '.github/workflows/app-preview.yml']
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Shows "skip to a sample vault" on the first screen (src/preview.ts). The release gate refuses a
      # store build with it set (NAMED STOP PREVIEW_BUILD).
      EXPO_PUBLIC_KMP_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run preview:web
      - name: Publish the free phone preview and prove it is served
        id: hosted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/preview/host.mjs keepmyproof-app-preview
      - name: Link the preview on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.hosted.outputs.url }}
        with:
          script: |
            const body = `Open the phone app preview: ${process.env.PREVIEW_URL}\n\nCommit: ${context.sha}. Free web preview with sample papers; no Appetize minutes.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

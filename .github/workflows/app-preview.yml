# THE FREE WEB PREVIEW (docs/preview.md): exports the app for a browser with sample papers only and
# publishes it to the Cloudflare Pages project keepmyproof-app-preview. The project root
# https://keepmyproof-app-preview.pages.dev always shows the newest main build; a PR gets its own
# branch link, commented on the PR. Free; no Appetize minutes. Its own job, not part of Fast checks.
name: App preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'assets/**', 'app.config.ts', 'package.json', 'package-lock.json', 'topics.json',
      'scripts/preview/host.mjs', 'tap-through.json', '.github/workflows/app-preview.yml']
  pull_request:
    paths: ['app/**', 'src/**', 'assets/**', 'app.config.ts', 'package.json', 'package-lock.json', 'topics.json',
      'scripts/preview/host.mjs', 'tap-through.json', '.github/workflows/app-preview.yml']
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    environment: reviewed-main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      url: ${{ steps.hosted.outputs.url }}
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Shows "skip to a sample vault" on the first screen (src/preview.ts, bundled only with this set). The release gate refuses a
      # store build with it set (NAMED STOP PREVIEW_BUILD).
      EXPO_PUBLIC_KMP_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run preview:web
      - name: Publish the free phone preview and prove it is served
        id: hosted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/preview/host.mjs keepmyproof-app-preview
      - name: Link the preview on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.hosted.outputs.url }}
        with:
          script: |
            const body = `Open the phone app preview: ${process.env.PREVIEW_URL}\n\nCommit: ${context.sha}. Free web preview with sample papers; no Appetize minutes.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
  # THE TAP-THROUGH (ship-ready app-review.md, required for any PR that changes a screen): a robot taps
  # through this preview like a person, at 390 px light and dark, from tap-through.json. Red on a dead
  # button, a console error, an error screen, an unreachable step or a Plus promise with no screen
  # behind it. Free (public repo); every write is blocked, nothing real is touched.
  tap-through:
    needs: preview
    uses: seq23/boss-os/.github/workflows/tap-through.yml@feat/tap-through
    with:
      target: ${{ needs.preview.outputs.url }}
      runner_ref: feat/tap-through  # until seq23/boss-os#509 lands; then this line and the @ref go to main

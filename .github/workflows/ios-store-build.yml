name: iOS store build
# Manual only. Builds the App Store (TestFlight) .ipa on a free GitHub macOS runner
# with `eas build --local`; signing credentials are fetched from EAS via EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      simulator:
        description: Build for the iPhone simulator instead (app.tar.gz, for the App Review recording; cannot be submitted)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ensure fastlane and CocoaPods
        run: |
          command -v fastlane || brew install fastlane
          command -v pod || brew install cocoapods
      - name: EAS local build
        run: npx --yes eas-cli@latest build --platform ios --profile ${{ inputs.simulator && 'simulator' || 'testflight' }} --local --non-interactive --output ${{ inputs.simulator && 'app.tar.gz' || 'app.ipa' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.simulator && 'app-simulator' || 'app-ipa' }}
          path: ${{ inputs.simulator && 'app.tar.gz' || 'app.ipa' }}
          retention-days: 3
          if-no-files-found: error

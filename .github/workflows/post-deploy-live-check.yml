name: Post-deploy live check

# After each deploy of the site: wait (bounded, 20 min) until keepmyproof.com serves this commit
# (site/build.mjs writes /build.txt from Cloudflare Pages' CF_PAGES_COMMIT_SHA), then read what the edge
# really serves: crawl files, icons, share card, homepage structured data, IndexNow key, About and vault
# pages, a real 404 and sampled sitemap URLs on the first hop (scripts/live-check.mjs). Read-only.
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/site/**', 'topics.json', 'store/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: post-deploy-live-check
  cancel-in-progress: true
jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for the deploy of this commit
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 40); do
            live=$(curl -s --max-time 10 "https://keepmyproof.com/build.txt?t=$i" || true)
            [ "$live" = "$GITHUB_SHA" ] && { echo "live after ~$((i * 30))s"; exit 0; }
            sleep 30
          done
          echo "NAMED STOP [DEPLOY_NOT_LIVE] keepmyproof.com does not serve $GITHUB_SHA after 20 minutes (live: $live)"; exit 2
      - run: node scripts/live-check.mjs

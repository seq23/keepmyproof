name: Entity backlink watch

# Weekly (search-readiness k6): every sameAs profile in site/data/entity.json still resolves, and the
# live homepage carries the same sameAs and the Spry Labs parent (scripts/entity-watch.mjs). A dead
# profile is NAMED STOP [SAMEAS_DEAD] and turns this run red so it is seen. Read-only.
on:
  schedule:
    - cron: '17 13 * * 1'  # Mondays 13:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: entity-backlink-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/entity-watch.mjs

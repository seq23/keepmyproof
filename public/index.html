<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- The archive background from the first paint, light and dark, so a dark phone never flashes white
         before the app draws (video watch 28 Nov 2026, finding 15). Colours: src/ui.tsx palette bg. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #F3F4F1;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #121615;
        }
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>

# Adds one invented note to the folder that is open. Env: TITLE, NOTE. Ends on the folder, which lists the note, or (after
# the very first save) on "How did you hear about KeepMyProof?". Used by preview.yaml and the device gate.
# The name is typed first, while no keyboard is up; Enter on the one-line name closes the keyboard. Then the note, and
# Save is pressed with the note's keyboard still up, as a person does: Save sits in the bar above the keyboard.
# Why this order: no tap is ever made into the page while a keyboard is up. Maestro counts a field as visible when it
# is inside the screen, even when the Save bar and the keyboard cover it, and centres it on the whole screen, not on the
# part the keyboard leaves. Gate run 46163383574, group A (screen-hierarchy step-031..055 in its debug output): with the
# note's keyboard up (keys from y 539 pt) the name field sat at y 507-553 pt, under the Save bar (y 459-527 pt); every
# tap on it landed on the bar, the focus stayed in the note, and the name went into the note ("Gate note one\n").
# (hideKeyboard is not used: it failed on iOS 26, run 46079345955.)
appId: com.keepmyproof.app
---
- scrollUntilVisible:
    element: "\\+ Add something"
    direction: DOWN
- tapOn: "\\+ Add something"
# The name: centred with no keyboard up, it sits mid-screen, clear of the Save bar at the bottom.
- scrollUntilVisible:
    element:
      id: "Name it"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      # The name is read back from its field and typed again if it did not land: on run 46074471722 the tap came
      # while the page was still scrolling and the name stayed empty.
      - tapOn:
          id: "Name it"
      - waitForAnimationToEnd
      - tapOn:
          id: "Name it"
      - eraseText: 80
      - inputText: ${TITLE}
      - pressKey: Enter
      - waitForAnimationToEnd
      - assertVisible:
          id: "Name it"
          text: ${TITLE}
# The note: the page is scrolled until its last line shows. The note box is then above that line and the "Tags" row,
# so it is clear of the Save bar, and a missed tap cannot press Save (the box is not centred: too little of the page
# follows it to centre it, run 46086983016).
- scrollUntilVisible:
    element: "The app also notes when you saved this\\..*"
    direction: DOWN
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "Your note \\(optional\\)"
      - eraseText: 120
      - inputText: ${NOTE}
      # The note is in its own box, whole (a wrong focus would have typed it into the name or nowhere).
      - extendedWaitUntil:
          visible:
            id: "Your note \\(optional\\)"
            text: ${NOTE}
          timeout: 5000
- scrollUntilVisible:
    element: "Save to .*"
    direction: DOWN
- tapOn: "Save to .*"
- extendedWaitUntil:
    visible: "Checklist|How did you hear about KeepMyProof\\?"
    timeout: 15000
# Saved: the folder lists the note by its name (a refused save stays on the add screen and stops above; a name that
# took the note's text would not match). After the very first save the app asks how you heard first, a screen that
# only ever follows a save.
- runFlow:
    when:
      visible: "Checklist"
    commands:
      - scrollUntilVisible:
          element: "${TITLE}"
          direction: DOWN
      - scrollUntilVisible:
          element: "← Back to .*"
          direction: UP

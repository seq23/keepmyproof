# Adds one invented note to the folder that is open. Env: TITLE, NOTE. After the very first save the app asks how you heard about it; that counts as done too. Used by preview.yaml and the device gate.
# The note (multiline) is typed first; then the name, and Enter on the one-line name closes the keyboard so it
# never covers the save button. The name is read back from its field before Save, and typed again if it did not
# land: on run 46074471722 the tap on the name came while the page was still scrolling and the name stayed empty.
# (hideKeyboard is not used: it failed on iOS 26, run 46079345955.)
appId: com.keepmyproof.app
---
- scrollUntilVisible:
    element: "\\+ Add something"
    direction: DOWN
    centerElement: true
- tapOn: "\\+ Add something"
- scrollUntilVisible:
    element:
      id: "Your note \\(optional\\)"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "Your note \\(optional\\)"
- inputText: ${NOTE}
- scrollUntilVisible:
    element:
      id: "Name it"
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "Name it"
      - eraseText: 80
      - inputText: ${TITLE}
      - pressKey: Enter
      - waitForAnimationToEnd
      - assertVisible:
          id: "Name it"
          text: ${TITLE}
- scrollUntilVisible:
    element: "Save to .*"
    direction: DOWN
    centerElement: true
- tapOn: "Save to .*"
- extendedWaitUntil:
    visible: "Checklist|How did you hear about KeepMyProof\\?"
    timeout: 15000

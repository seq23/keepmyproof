# Adds one invented note to the folder that is open. Env: TITLE, NOTE. After the very first save the app asks how you heard about it; that counts as done too. Used by preview.yaml and the device gate.
# The note (multiline) is typed first; then the name, and Enter on the one-line name closes the keyboard so it
# never covers the save button. The name is read back from its field before Save, and typed again if it did not
# land: on run 46074471722 the tap on the name came while the page was still scrolling and the name stayed empty.
# (hideKeyboard is not used: it failed on iOS 26, run 46079345955. Only the name field is centered: "+ Add something"
# and Save sit at the end of the page and can never be centered, run 46086983016.)
appId: com.keepmyproof.app
---
- scrollUntilVisible:
    element: "\\+ Add something"
    direction: DOWN
- tapOn: "\\+ Add something"
- scrollUntilVisible:
    element:
      id: "Your note \\(optional\\)"
    direction: DOWN
- tapOn:
    id: "Your note \\(optional\\)"
- inputText: ${NOTE}
- scrollUntilVisible:
    element:
      id: "Name it"
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      # With the note's keyboard still up, the first tap only closes the keyboard and the name field does not take
      # focus (run 46083058306: the name went into the note field, and eraseText wiped the note). Tap again to focus.
      - tapOn:
          id: "Name it"
      - waitForAnimationToEnd
      - tapOn:
          id: "Name it"
      - eraseText: 80
      - inputText: ${TITLE}
      - pressKey: Enter
      - waitForAnimationToEnd
      - assertVisible:
          id: "Name it"
          text: ${TITLE}
# The note is still whole (a wrong focus would have typed into it or erased it).
- scrollUntilVisible:
    element:
      id: "Your note \\(optional\\)"
      text: ${NOTE}
    direction: DOWN
- scrollUntilVisible:
    element: "Save to .*"
    direction: DOWN
- tapOn: "Save to .*"
- extendedWaitUntil:
    visible: "Checklist|How did you hear about KeepMyProof\\?"
    timeout: 15000

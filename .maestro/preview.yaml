# THE SIMULATOR PREVIEW (docs/preview.md): walks every screen in English and saves one PNG per
# screen, numbered in order. scripts/validate.mjs ("preview-screens") fails if a screen in
# app/index.tsx has no takeScreenshot step here and no "not-shown" line; scripts/preview/shots.mjs
# fails the run if a PNG is missing or blank. Sample data is invented (AGENTS.md).
# not-shown: custom — Plus only; the preview build cannot buy Plus, so "Make your own folder" opens the Plus page
appId: com.keepmyproof.app
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Continue in English ›"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: 01-first

# Restore a backup (from the first screen), then back.
# The first screen is now one swipe tall (the preview-only skip button made it longer); scrollUntilVisible's
# 100%-visibility check missed a fully shown button on run 41444029917, so swipe and wait for it instead.
# Two swipes since the first screen offers four languages (a swipe at the bottom is harmless).
- scroll
- scroll
- extendedWaitUntil:
    visible: "Restore a backup ›"
    timeout: 20000
- tapOn: "Restore a backup ›"
- waitForAnimationToEnd
- takeScreenshot: 02-restore
- tapOn: "← Back"

# Passcode, recovery phrase, confirm.
- scrollUntilVisible:
    element: "Continue in English ›"
    direction: DOWN
- tapOn: "Continue in English ›"
- tapOn:
    id: "Passcode"
- inputText: "123456"
- tapOn:
    id: "Enter the same six numbers again"
- inputText: "123456"
- tapOn: "Choose a passcode for this app"
- waitForAnimationToEnd
- takeScreenshot: 03-setup
- scrollUntilVisible:
    element: "Save passcode ›"
    direction: DOWN
- tapOn: "Save passcode ›"
- extendedWaitUntil:
    visible: "Your 12-word recovery phrase"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 04-phrase
# The words show numbered in two columns ("1.  pond"), one text each: copy all 12, then type them back.
- copyTextFrom: "1\\.\\s+[a-z]+"
- evalScript: ${output.w1 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "2\\.\\s+[a-z]+"
- evalScript: ${output.w2 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "3\\.\\s+[a-z]+"
- evalScript: ${output.w3 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "4\\.\\s+[a-z]+"
- evalScript: ${output.w4 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "5\\.\\s+[a-z]+"
- evalScript: ${output.w5 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "6\\.\\s+[a-z]+"
- evalScript: ${output.w6 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "7\\.\\s+[a-z]+"
- evalScript: ${output.w7 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "8\\.\\s+[a-z]+"
- evalScript: ${output.w8 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "9\\.\\s+[a-z]+"
- evalScript: ${output.w9 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "10\\.\\s+[a-z]+"
- evalScript: ${output.w10 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "11\\.\\s+[a-z]+"
- evalScript: ${output.w11 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- copyTextFrom: "12\\.\\s+[a-z]+"
- evalScript: ${output.w12 = maestro.copiedText.replace(/^\d+\.\s+/, '')}
- tapOn: "I.ve written them down ›"
- tapOn:
    id: "12 words, separated by spaces"
- inputText: ${[output.w1, output.w2, output.w3, output.w4, output.w5, output.w6, output.w7, output.w8, output.w9, output.w10, output.w11, output.w12].join(' ')}
- tapOn: "Type your 12 words to confirm"
- waitForAnimationToEnd
- takeScreenshot: 05-confirmPhrase
- tapOn: "Go to Home ›"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "What you can keep here"
    timeout: 30000

# Sample papers: two in Divorce or custody (one checklist line ticked), one in Workplace evidence.
# "How did you hear about KeepMyProof?" comes after the first save.
- scrollUntilVisible:
    element: "Workplace evidence.*"
    direction: DOWN
- tapOn: "Workplace evidence.*"
- extendedWaitUntil:
    visible: "Checklist"
    timeout: 15000
- runFlow:
    file: add-note.yaml
    env:
      TITLE: "Notes from the first lawyer call"
      NOTE: "Ask about the house appraisal and the school calendar."
- extendedWaitUntil:
    visible: "How did you hear about KeepMyProof\\?"
    timeout: 15000
- takeScreenshot: 06-heard
- tapOn: "Skip ›"
- extendedWaitUntil:
    visible: "Checklist"
    timeout: 15000
- tapOn: "← Back to Home"
- scrollUntilVisible:
    element: "Divorce or custody.*"
    direction: DOWN
- tapOn: "Divorce or custody.*"
- extendedWaitUntil:
    visible: "Checklist"
    timeout: 15000
- runFlow:
    file: add-note.yaml
    env:
      TITLE: "Joint bank statement, March"
      NOTE: "Page 2 shows the transfer on the 14th."
- runFlow:
    file: add-note.yaml
    env:
      TITLE: "Parenting schedule draft"
      NOTE: "Weekdays with me, alternate weekends."
# Tick the first checklist line by hand.
- tapOn: "Bank, retirement and debt statements"
- tapOn: "← Back to Home"
- waitForAnimationToEnd
- takeScreenshot: 07-home

# A folder, adding a paper (cancelled, so the folder keeps its two), a paper, the folder PDF.
- scrollUntilVisible:
    element: "Divorce or custody.*"
    direction: DOWN
- tapOn: "Divorce or custody.*"
- extendedWaitUntil:
    visible: "Checklist"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 08-folder
- scrollUntilVisible:
    element: "\\+ Add something"
    direction: DOWN
- tapOn: "\\+ Add something"
- tapOn:
    id: "Name it"
- inputText: "Car title and loan papers"
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: 09-add
- scrollUntilVisible:
    element: "Cancel"
    direction: DOWN
- tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Checklist"
    timeout: 15000
- scrollUntilVisible:
    element: "Make a PDF of this folder ›"
    direction: DOWN
- tapOn:
    text: "Open ›"
    below: "Parenting schedule draft"
- extendedWaitUntil:
    visible: "Your note"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 10-detail
- scrollUntilVisible:
    element: "Make a PDF of this folder ›"
    direction: DOWN
- tapOn: "Make a PDF of this folder ›"
- waitForAnimationToEnd
- takeScreenshot: 11-pdf
# Make the PDF itself: the share sheet opens with it (the CI walk also copies the file out while the
# sheet is open, so the PDF can be checked and shown). Tapping outside closes the sheet on iPhone and iPad.
- scrollUntilVisible:
    element: "Save the PDF ›"
    direction: DOWN
- tapOn: "Save the PDF ›"
- extendedWaitUntil:
    visible: "(Copy|Save to Files|Print|Markup)"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 12-pdf--shared
- tapOn:
    point: "50%,6%"
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd
- tapOn: "← Back to .*"
- tapOn: "← Back to Home"

# Backup, Settings, Plus.
- tapOn: "Backup"
- waitForAnimationToEnd
- takeScreenshot: 13-backup
- tapOn: "Settings"
- waitForAnimationToEnd
- takeScreenshot: 14-settings
- scrollUntilVisible:
    element: "See Plus ›"
    direction: DOWN
- tapOn: "See Plus ›"
- extendedWaitUntil:
    visible: "KeepMyProof Plus"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 15-plus
- scrollUntilVisible:
    element: "Not now"
    direction: DOWN
- tapOn: "Not now"

# Change passcode, new recovery words, erase everything (each opened, then back).
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Change passcode ›"
    direction: DOWN
- tapOn: "Change passcode ›"
- waitForAnimationToEnd
- takeScreenshot: 16-changeCode
- tapOn: "← Back"
- scrollUntilVisible:
    element: "Make new recovery words ›"
    direction: DOWN
- tapOn: "Make new recovery words ›"
- waitForAnimationToEnd
- takeScreenshot: 17-renew
- tapOn: "← Back"
- scrollUntilVisible:
    element: "Erase everything on this phone…"
    direction: DOWN
- tapOn: "Erase everything on this phone…"
- waitForAnimationToEnd
- takeScreenshot: 18-erase
- tapOn: "Cancel"

# Lock, and the forgotten-passcode reset.
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Lock my papers ›"
    direction: DOWN
- tapOn: "Lock my papers ›"
- extendedWaitUntil:
    visible: "Your papers are locked"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 19-lock
- tapOn: "Forgot the passcode\\? ›"
- waitForAnimationToEnd
- takeScreenshot: 20-reset

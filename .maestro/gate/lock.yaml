# Settings › Lock my papers. Ends on the lock screen.
appId: com.keepmyproof.app
---
- runFlow:
    file: tab.yaml
    env:
      TAB: "Settings"
      MARK: "No account\\. No ads\\. No analytics\\..*"
- scrollUntilVisible:
    element: "Lock my papers ›"
    direction: DOWN
- tapOn: "Lock my papers ›"
- extendedWaitUntil:
    visible: "Your papers are locked"
    timeout: 15000

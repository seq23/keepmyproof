# The system document picker: opens FILE from Files › On My iPhone (Browse first if it opens on Recents).
appId: com.keepmyproof.app
---
- extendedWaitUntil:
    visible: "Browse|Recents|On My iPhone|${FILE.split('.')[0]}.*"
    timeout: 20000
# Retried until the file shows: a lost Browse or On My iPhone tap is pressed again.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: "${FILE.split('.')[0]}.*"
          commands:
            - runFlow:
                when:
                  visible: "Browse"
                commands:
                  - tapOn: "Browse"
                  - waitForAnimationToEnd:
                      timeout: 5000
            - runFlow:
                when:
                  visible: "On My iPhone"
                commands:
                  - tapOn: "On My iPhone"
      - extendedWaitUntil:
          visible: "${FILE.split('.')[0]}.*"
          timeout: 10000
# Tap the file's cell (id "gate-paper, pdf" / "gate-good.kmp, kmp"), not its name label: a tap on the label left the
# picker open (gate run 46090441187, flows 7 and 9). Files labels a PDF or PNG without its extension ("gate-paper"),
# so both lines match on the name before the first dot. No "$" inside ${…}: Maestro evaluates only \$\{([^$]*)}, and
# an expression holding one is left as plain text (gate run 46098006485, flows 8, 10, 16, 22, 23: no cell matched).
# Retried and idempotent: a tap during Files' push to "On My iPhone" is lost and the picker stays open (gate run
# 46118560120, flow 2: the cell was found and tapped, the picker never closed). The picker opened straight on the
# folder in every restore of that run, and those taps worked.
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      # Tap the file's PICTURE, the element right above its name. The cell's own centre is its name line (cell
      # [140,212][262,401], name [143,305][259,325], picture [159,216][243,300] in gate run 46158994320, group B), so
      # "tap the cell" was a tap on the name, which leaves the picker open: groups A–D all stopped there that run.
      - runFlow:
          when:
            visible:
              id: "${FILE.split('.')[0]}(\\.[a-z]+)?, .*"
          commands:
            - tapOn:
                above:
                  text: "${FILE.split('.')[0]}(\\.[a-z]+)?"
                childOf:
                  id: "${FILE.split('.')[0]}(\\.[a-z]+)?, .*"
      - extendedWaitUntil:
          notVisible:
            id: "${FILE.split('.')[0]}(\\.[a-z]+)?, .*"
          timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          notVisible: "Open"
          timeout: 10000

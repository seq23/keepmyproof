# Opens the system document picker with the app button OPEN and picks FILE from Files › On My iPhone.
# Env: OPEN (the button's text), FILE (the name in On My iPhone).
# One attempt = open a picker, go to On My iPhone, tap the file, see the picker close. A picker still open after the
# tap is closed with its own Cancel (the app is told "cancelled" and changes nothing) and the next attempt starts on a
# new picker. Why the whole attempt is retried, not the tap: a picker that ignores one tap ignores the next three as
# well. Four taps 10 s apart on one open picker all left it open in gate runs 46158994320 (groups A and D on
# gate-paper, B and C on gate-photo, tapping the cell) and 46163383574 (group D on gate-photo, tapping its picture;
# screen-hierarchy step-177..189: the picker on On My iPhone, gate-photo's cell enabled, nothing over it). The same
# taps picked the same files in other groups of those runs, so neither the tap point nor the file decides it.
# The picker may stay up while it copies a big file (60 MB gate-big.kmp: 10 s was not enough in run 46163383574,
# group E), so a close is waited for 30 s before the picker is called stuck.
appId: com.keepmyproof.app
---
- retry:
    maxRetries: 3
    commands:
      # A picker left open by the attempt before: its Cancel closes it, and the app's button shows again.
      - runFlow:
          when:
            visible: "Cancel"
            notVisible: ${OPEN}
          commands:
            - runFlow:
                file: tap.yaml
                env:
                  TAP: "Cancel"
                  THEN: ${OPEN}
      - scrollUntilVisible:
          element: ${OPEN}
          direction: DOWN
      - runFlow:
          file: tap.yaml
          env:
            TAP: ${OPEN}
            THEN: "Browse|Recents|On My iPhone|${FILE.split('.')[0]}.*"
      # Browse, then On My iPhone, when the picker opens elsewhere (Recents, or the Browse list). Files labels a PDF or
      # PNG without its extension ("gate-paper"), so every line matches on the name before the first dot. No "$" inside
      # ${…}: Maestro evaluates only \$\{([^$]*)}, and an expression holding one is left as plain text (gate run
      # 46098006485, flows 8, 10, 16, 22, 23: no cell matched).
      - runFlow:
          when:
            visible: "Browse"
            notVisible: "${FILE.split('.')[0]}.*"
          commands:
            - tapOn: "Browse"
            - waitForAnimationToEnd:
                timeout: 5000
      - runFlow:
          when:
            visible: "On My iPhone"
            notVisible: "${FILE.split('.')[0]}.*"
          commands:
            - tapOn: "On My iPhone"
      - extendedWaitUntil:
          visible: "${FILE.split('.')[0]}.*"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 5000
      # The file's picture, the element right above its name in its cell (cell "gate-photo, png" [140,212][262,401],
      # picture [159,216][243,300], name [143,305][259,325] in gate run 46163383574, group D).
      - tapOn:
          above:
            text: "${FILE.split('.')[0]}(\\.[a-z]+)?"
          childOf:
            id: "${FILE.split('.')[0]}(\\.[a-z]+)?, .*"
      - extendedWaitUntil:
          notVisible:
            id: "${FILE.split('.')[0]}(\\.[a-z]+)?, .*"
          timeout: 30000
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          notVisible: "Open"
          timeout: 10000

# Leaves the app on an open folder (paper titles on screen); the host then sends it to the background.
appId: com.keepmyproof.app
---
# Retried from the Folders tab: a tap on the folder card that lands elsewhere (gate run 46128557523, flow 35: it
# opened Backup) is undone by tab.yaml's next round instead of failing the check.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: "Gate note one"
          commands:
            - runFlow:
                file: tab.yaml
                env:
                  TAB: "Folders"
                  MARK: "Free plan: .*|\\d+ items · Plus"
            - scrollUntilVisible:
                element: "Divorce, custody.*"
                direction: DOWN
            - waitForAnimationToEnd:
                timeout: 5000
            - tapOn: "Divorce, custody.*"
      - extendedWaitUntil:
          visible: "Gate note one"
          timeout: 10000
- takeScreenshot: gate-${SHOT}-folder-open

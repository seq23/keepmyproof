# Leaves the app on an open folder (paper titles on screen); the host then sends it to the background.
appId: com.keepmyproof.app
---
# Retried from the Folders tab: a tap on the folder card that lands elsewhere is undone by tab.yaml's next round.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: "Gate note one"
          commands:
            - runFlow:
                file: tab.yaml
                env:
                  TAB: "Folders"
                  MARK: "Free plan: .*|\\d+ items · Plus"
            # Centred: on Home with the backup reminder showing, the folder card sits at y 770-860 pt, under the tabs
            # (y 782-830 pt; gate run 46163383574, group B, dbg-6 hierarchy), and Maestro counts it visible there. The
            # tap pressed "Backup" every round (same run, group E, dbg-11: Backup selected in all 4 hierarchies; run
            # 46128557523 flow 35 alike). Here the card is below the middle,
            # so centring scrolls it up (add.yaml's overshoot was a card already at the top).
            - scrollUntilVisible:
                element: "Divorce, custody.*"
                direction: DOWN
                centerElement: true
            - waitForAnimationToEnd:
                timeout: 5000
            - tapOn: "Divorce, custody.*"
      - extendedWaitUntil:
          visible: "Gate note one"
          timeout: 10000
- takeScreenshot: gate-${SHOT}-folder-open

# Leaves the app on an open folder (paper titles on screen); the host then sends it to the background.
appId: com.keepmyproof.app
---
# The first folder card, near the top of Home: not centred (gate run 46112815437, flow 2: centring a card that is
# already at the top overshot and failed with the card in full view; the same step passed at flow 25).
- scrollUntilVisible:
    element: "Divorce, custody.*"
    direction: DOWN
- tapOn: "Divorce, custody.*"
- extendedWaitUntil:
    visible: "Gate note one"
    timeout: 15000
- takeScreenshot: gate-${SHOT}-folder-open

# Settings › Also open with Face ID: switch on. The system asks once to allow Face ID; the host then matches the face.
appId: com.keepmyproof.app
---
- runFlow:
    file: tab.yaml
    env:
      TAB: "Settings"
      MARK: "No account\\. No ads\\. No analytics\\..*"
# Centred: Maestro counts a row as visible when it is inside the screen, even under the tab bar. On Settings the page
# ends at y 772 pt and the tabs sit at y 782-830 pt (gate run 46163383574, group B, dbg-6 hierarchy). In that run the
# switch tap was followed by Home with the Folders tab selected (dbg-7 screenshot and hierarchy, flows 6, 8 and 10
# alike): a row found by an uncentred scroll sat under the tabs and the tap pressed "Folders".
- scrollUntilVisible:
    element: "Also open with Face ID"
    direction: DOWN
    centerElement: true
# The card's text and its switch carry the same words; only the switch can be checked. The switch is the one below
# the text in its card (an index would lean on an order Maestro does not promise; iOS lists each text twice). It turns
# on only after the Face ID match the host makes once this flow ends, so its effect is proven by faceid-check.yaml
# (gate run 46128557523: the tap was reported done and the switch stayed off). Pressed only while it is off, so a
# second round never turns it off again. The screenshot after the tap shows where it left the app.
- runFlow:
    when:
      notVisible:
        text: "Also open with Face ID"
        checked: true
    commands:
      # Effect checked by faceid-check.yaml after the host's match (run.sh faceid_on tries again if it is off).
      - tapOn:
          text: "Also open with Face ID"
          below:
            text: "Also open with Face ID"
- takeScreenshot: gate-faceid-switch-tapped
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "OK|Allow"
    commands:
      # A system alert (allow Face ID): effect checked by faceid-check.yaml after the host's match.
      - tapOn: "OK|Allow"

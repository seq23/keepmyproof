# Prints the item count Home shows (GATE_COUNT=n).
appId: com.keepmyproof.app
---
- runFlow:
    when:
      notVisible: "Free plan: .*"
    commands:
      - tapOn: "Folders"
- copyTextFrom: "Free plan: \\d+ of 25 items used\\.|\\d+ items · Plus"
- evalScript: ${console.log('GATE_COUNT=' + (maestro.copiedText.match(/\d+/) || ['?'])[0])}

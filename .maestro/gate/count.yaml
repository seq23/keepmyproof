# Prints the item count Home shows (GATE_COUNT=n), from wherever the last step ended.
appId: com.keepmyproof.app
---
- runFlow:
    file: tab.yaml
    env:
      TAB: "Folders"
      MARK: "Free plan: \\d+ of 25 items used\\.|\\d+ items · Plus"
- copyTextFrom: "Free plan: \\d+ of 25 items used\\.|\\d+ items · Plus"
- evalScript: "${http.post('http://127.0.0.1:8765/', { body: 'GATE_COUNT=' + (maestro.copiedText.match(/[0-9]+/) || ['?'])[0] })}"

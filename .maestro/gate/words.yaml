# Copies the 12 numbered recovery words on screen into output.words.
appId: com.keepmyproof.app
---
- evalScript: ${output.w = []}
- repeat:
    times: 12
    commands:
      - evalScript: ${output.n = output.w.length + 1}
      - copyTextFrom: "${output.n}\\.\\s+[a-z]+"
      - evalScript: ${output.w.push(maestro.copiedText.replace(/^\d+\.\s+/, '').trim())}
- evalScript: ${output.words = output.w.join(' ')}

# Opens a tab and waits until that tab is the selected one, then until MARK (that screen's content) shows.
# Env: TAB (Folders | Backup | Settings), MARK.
# The selected state, not a text, says which screen is open: Home's "Back up now ›" nudge card matched the Backup
# tab's MARK, so the flow believed it was on Backup and scrolled Home (gate run 46128557523, flows 26 and 31).
# A pushed screen (a refused restore, an open folder) has no tab bar: its "← Back" is pressed first, and a lost
# "← Back" tap is retried here instead of failing every flow after it (same run, flows 22 and 23).
appId: com.keepmyproof.app
---
- retry:
    maxRetries: 4
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "← Back.*"
          commands:
            - tapOn: "← Back.*"
            - waitForAnimationToEnd:
                timeout: 5000
      - runFlow:
          when:
            notVisible:
              text: ${TAB}
              selected: true
          commands:
            - tapOn:
                text: ${TAB}
                selected: false
      - extendedWaitUntil:
          visible:
            text: ${TAB}
            selected: true
          timeout: 8000
- extendedWaitUntil:
    visible: ${MARK}
    timeout: 15000

# Presses a button until the screen it is on goes away. Env: TAP (the button's text). Idempotent: once the button is
# gone (or covered by the sheet it opened) nothing is pressed again, and a disabled button (a save running) ignores it.
# On the Simulator's software renderer a tap can be reported done and never reach the app: gate run 46124321633,
# flow 2 (a complete "Save to …" form stayed open) and flow 7 ("Back up now ›" opened no share sheet).
appId: com.keepmyproof.app
---
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: ${TAP}
          commands:
            - tapOn: ${TAP}
      - extendedWaitUntil:
          notVisible: ${TAP}
          timeout: 20000

# Taps TAP (text) until THEN shows. THEN is text only the screen after the tap has (or the result the tap starts).
# Why one helper for every tap: on the iOS 26 Simulator's software renderer a tap can be reported done and never reach
# the app (gate runs 46118560120, 46124321633, 46128557523: a cell, Save, Back up now, "← Back", the Face ID switch),
# and a flow that does not check the tap's effect goes on from the wrong screen, failing every flow after it.
# Idempotent: nothing is tapped once THEN shows, so a slow screen is never tapped twice.
appId: com.keepmyproof.app
---
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            notVisible: ${THEN}
          commands:
            - tapOn: ${TAP}
      - extendedWaitUntil:
          visible: ${THEN}
          timeout: 10000

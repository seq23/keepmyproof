# Backup › Check the saved backup: choose FILE, then check it. Ends on "✓ Backup checked." or the failure card.
appId: com.keepmyproof.app
---
- runFlow:
    file: tab.yaml
    env:
      TAB: "Backup"
      MARK: "Back up now ›"
- scrollUntilVisible:
    element: "Check the saved backup ›"
    direction: DOWN
- runFlow:
    file: pick.yaml
    env:
      OPEN: "Check the saved backup ›"
      FILE: ${FILE}
- scrollUntilVisible:
    element: "Check the saved backup ›"
    direction: DOWN
- runFlow:
    file: tap.yaml
    env:
      TAP: "Check the saved backup ›"
      THEN: "Working…|✓ Backup checked\\.|The backup check failed.*"
- extendedWaitUntil:
    visible: "✓ Backup checked\\.|The backup check failed.*"
    timeout: 60000
- takeScreenshot: gate-${SHOT}-backup-check
- assertVisible: "✓ Backup checked\\."

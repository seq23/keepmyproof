# After the host's Face ID match: the Settings switch "Also open with Face ID" must be on (its checked state).
# If iOS asked to allow Face ID only now, allow it and say so (GATE_FACEID=allowed): the host matches again.
appId: com.keepmyproof.app
---
- runFlow:
    when:
      visible: "OK|Allow"
    commands:
      # A system alert (allow Face ID): effect checked by the host's next match and this flow run again.
      - tapOn: "OK|Allow"
      - evalScript: "${http.post('http://127.0.0.1:8765/', { body: 'GATE_FACEID=allowed' })}"
- extendedWaitUntil:
    visible:
      text: "Also open with Face ID"
      checked: true
    timeout: 10000
- takeScreenshot: gate-faceid-on-settings

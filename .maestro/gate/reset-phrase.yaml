# Forgot the passcode › set NEWCODE with the 12 WORDS. Ends unlocked, on Settings (where lock.yaml locked it).
appId: com.keepmyproof.app
---
- runFlow: lock.yaml
- tapOn: "Forgot the passcode\\? ›"
- tapOn:
    id: "New six-number passcode"
- inputText: ${NEWCODE}
- tapOn:
    id: "Enter the same six numbers again"
- inputText: ${NEWCODE}
- tapOn:
    id: "12 words, separated by spaces"
- inputText: ${WORDS}
# Closes the keyboard by tapping the screen heading (hideKeyboard fails on the iOS 26 Simulator).
- tapOn:
    text: "New six-number passcode"
    index: 0
- scrollUntilVisible:
    element: "Set a new passcode ›"
    direction: DOWN
- tapOn: "Set a new passcode ›"
# Unlocked: the app reopens on the screen it was locked from (Settings, by lock.yaml), so wait for the tab bar, which
# only an open vault shows (gate run 46098006485, flow 4: the reset worked and the app sat on Settings).
- extendedWaitUntil:
    visible: "Folders"
    timeout: 60000
- takeScreenshot: gate-${SHOT}-reset-phrase

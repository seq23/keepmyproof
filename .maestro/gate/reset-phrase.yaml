# Forgot the passcode › set NEWCODE with the 12 WORDS. Ends unlocked, on Settings (where lock.yaml locked it).
appId: com.keepmyproof.app
---
- runFlow: lock.yaml
- runFlow:
    file: tap.yaml
    env:
      TAP: "Forgot the passcode\\? ›"
      THEN: "Set a new passcode ›"
- runFlow:
    file: type.yaml
    env:
      FIELD: "New six-number passcode"
      TEXT: ${NEWCODE}
      SHOW: "••••••|${NEWCODE}"
- runFlow:
    file: type.yaml
    env:
      FIELD: "Enter the same six numbers again"
      TEXT: ${NEWCODE}
      SHOW: "••••••|${NEWCODE}"
- runFlow:
    file: type.yaml
    env:
      FIELD: "12 words, separated by spaces"
      TEXT: ${WORDS}
      SHOW: ${WORDS}
# Closes the keyboard by tapping the screen heading (hideKeyboard fails on the iOS 26 Simulator).
- tapOn:
    text: "New six-number passcode"
    index: 0
- scrollUntilVisible:
    element: "Set a new passcode ›"
    direction: DOWN
- runFlow:
    file: tap.yaml
    env:
      TAP: "Set a new passcode ›"
      THEN: "Working…|Folders"
- extendedWaitUntil:
    visible: "Folders"
    timeout: 60000
- takeScreenshot: gate-${SHOT}-reset-phrase

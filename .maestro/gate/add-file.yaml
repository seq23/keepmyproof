# Adds one file from Files to the open folder. Env: FILE (name in On My iPhone), TITLE.
appId: com.keepmyproof.app
---
- scrollUntilVisible:
    element: "\\+ Add something"
    direction: DOWN
- tapOn: "\\+ Add something"
# The add screen opens on Note; the File kind shows "Choose a file ›" (gate run 46090441187, flow 2).
- scrollUntilVisible:
    element: "File"
    direction: DOWN
- tapOn: "File"
- scrollUntilVisible:
    element: "Choose a file ›"
    direction: DOWN
- tapOn: "Choose a file ›"
- runFlow:
    file: pick.yaml
    env:
      FILE: ${FILE}
- extendedWaitUntil:
    visible:
      id: "Name it"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "Name it"
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "Name it"
      - waitForAnimationToEnd
      - tapOn:
          id: "Name it"
      - eraseText: 80
      - inputText: ${TITLE}
      - pressKey: Enter
      - waitForAnimationToEnd
      - assertVisible:
          id: "Name it"
          text: ${TITLE}
- scrollUntilVisible:
    element: "Save to .*"
    direction: DOWN
- tapOn: "Save to .*"
- extendedWaitUntil:
    visible: "Checklist"
    timeout: 20000
